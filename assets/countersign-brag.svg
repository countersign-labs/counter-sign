t="11"/><rect x="646.0" y="162" width="12" height="11"/><rect x="676.0" y="162" width="24" height="11"/></g><text x="430.0" y="250" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#83A87C" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">An agent signs its intent.</text><text x="430.0" y="280" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="19" fill="#C7E4BC" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">A human countersigns it into authority.</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" values="1;1;0;0;1" keyTimes="0;0.22;0.25;0.97;1"/></g><g opacity="0"><text x="430.0" y="78" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#5C7A57" font-weight="400" text-anchor="middle" letter-spacing="4" xml:space="preserve">THE MISSING LEG</text><text x="150" y="168" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" fill="#83A87C" font-weight="500" text-anchor="start" letter-spacing="0" xml:space="preserve">MCP          agent → tool</text><text x="150" y="214" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" fill="#83A87C" font-weight="500" text-anchor="start" letter-spacing="0" xml:space="preserve">A2A          agent → agent</text><text x="150" y="260" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="22" fill="#C7E4BC" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">COUNTERSIGN  agent → human authority</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.25;0.28;0.47;0.50;1"/></g><g opacity="0"><text x="430.0" y="66" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#5C7A57" font-weight="400" text-anchor="middle" letter-spacing="4" xml:space="preserve">HOW IT WORKS</text><text x="96" y="128" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#83A87C" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">1  sign an Intent      { action · risk · approvers · timeout }  + ed25519</text><text x="96" y="176" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#83A87C" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">2  route to a human    telegram · discord · slack · whatsapp · email</text><text x="96" y="224" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#83A87C" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">3  human countersigns  </text><text x="342" y="224" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#C7E4BC" font-weight="700" text-anchor="start" letter-spacing="0" xml:space="preserve">✓ approve</text><text x="451" y="224" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#83A87C" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">·  silence → declared Default</text><text x="96" y="272" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="16" fill="#83A87C" font-weight="400" text-anchor="start" letter-spacing="0" xml:space="preserve">4  signed receipt      portable · verifiable offline by anyone</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0;0" keyTimes="0;0.50;0.53;0.72;0.75;1"/></g><g opacity="0"><text x="430.0" y="62" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="13" fill="#5C7A57" font-weight="400" text-anchor="middle" letter-spacing="4" xml:space="preserve">BATTERIES INCLUDED</text><text x="430.0" y="112" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#83A87C" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">ed25519 receipts · timeout Defaults · two-person quorum</text><text x="430.0" y="140" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="15" fill="#83A87C" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">~5-line shim · 5 channels · EU AI Act Art.14 human oversight</text><text x="430.0" y="212" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="18" fill="#83A87C" font-weight="400" text-anchor="middle" letter-spacing="0" xml:space="preserve">MCP gave agents tools. A2A gave agents colleagues.</text><text x="430.0" y="250" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="23" fill="#C7E4BC" font-weight="700" text-anchor="middle" letter-spacing="0" xml:space="preserve">Countersign gives agents a boss.</text><text x="430.0" y="320" font-family="ui-monospace,'SFMono-Regular',Menlo,Consolas,'DejaVu Sans Mono',monospace" font-size="14" fill="#5C7A57" font-weight="400" text-anchor="middle" letter-spacing="1" xml:space="preserve">github.com/countersign-labs/countersign</text><animate attributeName="opacity" dur="18s" repeatCount="indefinite" calcMode="linear" values="0;0;1;1;0" keyTimes="0;0.75;0.78;0.98;1"/></g>
